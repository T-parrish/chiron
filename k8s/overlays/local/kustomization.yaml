apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - namespace.yaml

namespace: chiron-local

# Tag images with :local so you can `docker build` without a registry
images:
  - name: chiron/api-gateway
    newTag: local
  - name: chiron/job-service
    newTag: local
  - name: chiron/ocr-worker
    newTag: local
  - name: chiron/frontend
    newTag: local

patchesStrategicMerge:
  # Single-replica everything — save resources on a laptop
  - patches/replicas.yaml
  # Point Kafka clients to a local single-broker Kafka
  - patches/kafka-brokers.yaml
  # No Ingress TLS
  - patches/ingress.yaml
