# Point Kafka clients at a local single-broker Kafka.
# The api-gateway no longer talks to Kafka — job-service and ocr-worker do.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-service
spec:
  template:
    spec:
      containers:
        - name: job-service
          env:
            - name: KAFKA_BROKERS
              value: "host.docker.internal:9092"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-worker
spec:
  template:
    spec:
      containers:
        - name: ocr-worker
          env:
            - name: KAFKA_BROKERS
              value: "host.docker.internal:9092"
