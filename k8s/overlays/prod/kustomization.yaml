apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chiron-prod

# Vultr Container Registry. CI sets newTag to the immutable git SHA at deploy
# time; the semver below is the fallback for a manual `kubectl apply -k`.
# Replace the region (sjc) and registry name (chiron) with your own.
images:
  - name: chiron/api-gateway
    newName: sjc.vultrcr.com/chiron/api-gateway
    newTag: "1.0.0"   # pin to explicit semver/SHA in prod; never use :latest
  - name: chiron/job-service
    newName: sjc.vultrcr.com/chiron/job-service
    newTag: "1.0.0"
  - name: chiron/ocr-worker
    newName: sjc.vultrcr.com/chiron/ocr-worker
    newTag: "1.0.0"
  - name: chiron/frontend
    newName: sjc.vultrcr.com/chiron/frontend
    newTag: "1.0.0"

resources:
  - ../../base
  - namespace.yaml
  # hpa.yaml defines new HorizontalPodAutoscaler objects, so it's a resource, not a patch.
  - patches/hpa.yaml

patchesStrategicMerge:
  - patches/replicas.yaml
  - patches/kafka-brokers.yaml
  - patches/ingress.yaml
  - patches/resources.yaml

# Let every Deployment pull from the private Vultr registry. The secret is
# created once per namespace (see docs/ci-cd.md).
patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: vcr-credentials
