apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chiron-prod

images:
  - name: chiron/api-gateway
    newName: registry.example.com/chiron/api-gateway
    newTag: "1.0.0"   # pin to explicit semver in prod; never use :latest
  - name: chiron/job-service
    newName: registry.example.com/chiron/job-service
    newTag: "1.0.0"
  - name: chiron/ocr-worker
    newName: registry.example.com/chiron/ocr-worker
    newTag: "1.0.0"
  - name: chiron/frontend
    newName: registry.example.com/chiron/frontend
    newTag: "1.0.0"

resources:
  - ../../base
  - namespace.yaml
  # hpa.yaml defines new HorizontalPodAutoscaler objects, so it's a resource, not a patch.
  - patches/hpa.yaml

patchesStrategicMerge:
  - patches/replicas.yaml
  - patches/kafka-brokers.yaml
  - patches/ingress.yaml
  - patches/resources.yaml
