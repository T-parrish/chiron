apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

namespace: chiron-dev

images:
  - name: chiron/api-gateway
    newName: registry.example.com/chiron/api-gateway
    newTag: dev
  - name: chiron/ocr-worker
    newName: registry.example.com/chiron/ocr-worker
    newTag: dev
  - name: chiron/frontend
    newName: registry.example.com/chiron/frontend
    newTag: dev

patches:
  - path: patches/replicas.yaml
  - path: patches/kafka-brokers.yaml
  - path: patches/ingress.yaml
  - path: patches/resources.yaml
