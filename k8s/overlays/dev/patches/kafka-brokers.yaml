apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  template:
    spec:
      containers:
        - name: api-gateway
          env:
            - name: KAFKA_BROKERS
              value: "chiron-kafka-bootstrap.kafka-dev.svc.cluster.local:9092"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-worker
spec:
  template:
    spec:
      containers:
        - name: ocr-worker
          env:
            - name: KAFKA_BROKERS
              value: "chiron-kafka-bootstrap.kafka-dev.svc.cluster.local:9092"
