# Runs the schema migration once before job-service rolls out. job-service also
# applies the (idempotent) migration on startup, but a dedicated Job is the
# cleaner pattern when running multiple replicas -- it avoids every replica
# racing on CREATE TABLE at boot.
#
# The migration SQL is injected via a ConfigMap generated by Kustomize from
# services/job-service/migrations/001_init.sql (see kustomization.yaml), so
# there is a single source of truth for the schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  annotations:
    # Re-run on each apply by making the name unique would be ideal; for now the
    # migration is idempotent so re-applying a completed Job is a no-op.
    description: "Apply database schema migrations"
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: db-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "waiting for postgres..."; sleep 2;
              done
              psql "$DATABASE_URL" -f /migrations/001_init.sql
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: db-migrations
