# Install Strimzi operator before applying the Kafka CR below.
# kubectl create namespace kafka
# kubectl apply -f https://strimzi.io/install/latest?namespace=kafka -n kafka
#
# Then apply this file:
# kubectl apply -f k8s/kafka/strimzi-operator.yaml -n kafka
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: chiron
  namespace: kafka
spec:
  kafka:
    version: 3.8.0
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 20Gi
          deleteClaim: false
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 5Gi
      deleteClaim: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: ocr-jobs
  namespace: kafka
  labels:
    strimzi.io/cluster: chiron
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 3600000   # 1 hour
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: ocr-results
  namespace: kafka
  labels:
    strimzi.io/cluster: chiron
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 3600000
